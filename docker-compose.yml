# air-orchestrator-service local stack.
#
# This file starts *only* air-orchestrator-service. Redis, Postgres and Mongo belong to
# air-infra, which owns them for the whole estate — duplicating them here
# would give a developer two Redises and two sources of truth about which one
# holds their sessions. The model gateway is air-model-gateway, its own
# standalone compose stack — never on air-infra's network, by its own hard
# constraint (no runtime dependency on any other AIR service) — reached over the
# host exactly like air-classifier reaches it.
#
#   cd ../air-infra         && make up  # redis, postgres, mongo  :8080
#   cd ../air-model-gateway && make up  # the model gateway       :8083
#   make up                             # this service            :8081
#
# The air-net wiring at the bottom is the three lines air-infra's compose file
# prescribes for a sibling service. Joining `air-net` as *this* project's default
# network is what lets `gateway`, `redis` and the rest resolve by service name;
# without it the container would have to reach back out through the host — which
# is exactly what the `extra_hosts` entry below does for air-model-gateway, which
# is never on air-net.
#
# `air-net` exists only while air-infra's stack is up, so `make up` checks for it
# first and says so — see the Makefile.
#
# Session backend defaults to `memory` here, same as the host default — Redis
# session storage is Phase 2b (docs/00-plan.md), not implemented yet
# (`memory/session.py`'s `build_session_store` falls back and logs a warning if
# asked for `redis` today).

name: air-orchestrator-service

services:
  # Named for the repo, like every sibling service (air-rag, air-tools,
  # air-classifier-service), so the container reads `air-orchestrator-service-1`
  # rather than an anonymous `platform-1` in `docker ps` and Docker Desktop.
  # `image:` is pinned for the same reason: without it compose derives
  # `<project>-<service>`, which is not the name the estate tags by.
  air-orchestrator-service:
    build: .
    image: air-orchestrator-service:local
    restart: unless-stopped
    env_file: [.env]
    # Lets the container reach air-model-gateway on the host — the same pattern
    # air-classifier uses, since the gateway is never on air-net.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AIR_ORCHESTRATOR_SERVICE__APP__ENV: development
      # Container-to-container, so the service name rather than localhost.
      AIR_ORCHESTRATOR_SERVICE__INFRA__BASE_URL: http://gateway:8080
      # air-model-gateway is reached over the host — see the header above.
      AIR_ORCHESTRATOR_SERVICE__MODEL_GATEWAY__BASE_URL: http://host.docker.internal:8083
      # The gateway's own .env.example issues this exact token to this service
      # (AIR_MODEL_GATEWAY_SECURITY__SERVICE_TOKENS=...,air-orchestrator-service-dev:
      # air-orchestrator-service), so a local checkout of both authenticates with no
      # edits on either side.
      AIR_ORCHESTRATOR_SERVICE__MODEL_GATEWAY__API_KEY: air-orchestrator-service-dev
      AIR_ORCHESTRATOR_SERVICE__OBS__LOG_FORMAT: json
    ports: ["8081:8081"]
    healthcheck:
      # Liveness only — /v1/ready would report unready whenever the gateway blinked,
      # and compose would then restart a container that is working correctly.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/v1/health').read()"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  default:
    name: air-net
    external: true
