# air-platform local stack.
#
# This file starts *only* air-platform. Redis, Postgres, Mongo and the model
# gateway belong to air-infra, which owns them for the whole estate — duplicating
# them here would give a developer two Redises and two sources of truth about which
# one holds their sessions.
#
#   cd ../air-infra && make up     # redis, postgres, mongo, ollama, gateway :8080
#   cd ../air-platform && make up  # this service                            :8081
#
# The network wiring at the bottom is the three lines air-infra's compose file
# prescribes for a sibling service. Joining `air-net` as *this* project's default
# network is what lets `gateway`, `redis` and the rest resolve by service name;
# without it the container would have to reach back out through the host.
#
# `air-net` exists only while air-infra's stack is up, so `make up` checks for it
# first and says so — see the Makefile.

name: air-platform

services:
  platform:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      AIR_PLATFORM__APP__ENV: development
      # Container-to-container, so the service name rather than localhost.
      AIR_PLATFORM__INFRA__BASE_URL: http://gateway:8080
      AIR_PLATFORM__SESSION__BACKEND: redis
      AIR_PLATFORM__SESSION__REDIS_URL: redis://:localdevpass@redis:6379/1
      AIR_PLATFORM__OBS__LOG_FORMAT: json
    ports: ["8081:8081"]
    healthcheck:
      # Liveness only — /v1/ready would report unready whenever air-infra blinked,
      # and compose would then restart a container that is working correctly.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/v1/health').read()"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  default:
    name: air-net
    external: true
