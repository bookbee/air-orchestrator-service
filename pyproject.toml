[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "air-orchestrator-service"
version = "0.1.0"
description = "AIR Orchestrator Service — the conversational front door: orchestration, RAG, tools and actions over a streaming API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Vikas Roy" }]

# air-infra is a *service* dependency, reached over HTTP, not a package one.
# air-classifier set that precedent (providers/infra_provider.py talks to the
# gateway with httpx rather than importing air_infra_client), and following it
# keeps the two repos free of a build-time coupling that a path dependency would
# create. The contract is air-infra's published API; httpx is the transport.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.27",
    "orjson>=3.10",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
redis = ["redis>=5.2"]
otel = [
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]
# Everything a production image needs.
all = ["air-orchestrator-service[redis,otel]"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-redis>=4.6",
]

[project.scripts]
air-orchestrator-service = "air_orchestrator_service.__main__:main"

[project.urls]
Repository = "https://github.com/air/air-orchestrator-service"

[tool.hatch.build.targets.wheel]
packages = ["src/air_orchestrator_service"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "ASYNC",     # async correctness
    "S",         # bandit
    "T20",       # no print
]
ignore = [
    "S101",    # assert is fine in tests and internal invariants
    "B008",    # FastAPI Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]   # hardcoded test keys are the point

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["redis.*", "opentelemetry.*"]
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
